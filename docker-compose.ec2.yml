# QuitQ EC2 stack: Spring Boot backend on the private RDS instance
# + frontend (nginx reverse-proxies /api -> backend:8080).
# Image-based variant of docker-compose.yml — no build: sections, pulled from ECR.
#
# The database lives on RDS (quitq-db.cn0uqccqww16...): it is reachable only from
# this instance's security group, so no local MySQL service runs here. This file is
# the one CodeDeploy ships on every release, so the RDS endpoint is baked in as the
# default — the app can never silently fall back to a container database.

services:

  backend:
    image: 558975907408.dkr.ecr.ap-southeast-2.amazonaws.com/quitq-backend:latest
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://quitq-db.cn0uqccqww16.ap-southeast-2.rds.amazonaws.com:3306/quitq_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: deepcoder
      JWT_SECRET: quitqsecretsigningkeyforjwt2026

  frontend:
    image: 558975907408.dkr.ecr.ap-southeast-2.amazonaws.com/quitq-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
